org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# rive_common's own android/build.gradle hardcodes NDK 25.1.8937393, which
# predates 16KB memory page-size support and fails Play Console's page-size
# check (librive_text.so ships 4KB-aligned LOAD segments while every other
# native lib in the app, built with this project's own NDK 28, is compliant).
# rive_common reads this exact property to override its NDK choice.
rive.ndk.version=28.2.13676358
# NDK 28 refuses to build for platform 19, which is what rive_common's own
# module still declares (minSdkVersion 19) even though this app's real
# minSdk is 24 (flutter.minSdkVersion) — no device below 24 is ever
# targeted, so this stale declaration is safe to override.
android.ndk.suppressMinSdkVersionError=21
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
