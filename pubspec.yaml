name: restro
description: Restro Operator — Indian restaurant POS for waiters..
publish_to: 'none'
version: 1.1.0+15

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing (Navigator 2.0 wrapper)
  go_router: ^14.6.2

  # Liquid Glass rendering (iOS 26 style)

  # QR scanning for device pairing
  mobile_scanner: ^7.2.0

  # Currency formatting (₹), date filters
  intl: ^0.19.0

  # Audio playback for multi-sensory feedback
  audioplayers: ^6.1.0

  # Utility
  collection: ^1.18.0
  socket_io_client: ^3.0.2
  shared_preferences: ^2.2.3
  sensors_plus: ^6.1.0

  # Biometric unlock (FaceID / fingerprint → replays PIN verify)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Platform surfaces: widgets + Live Activity bridge + ready alerts
  home_widget: ^0.7.0
  flutter_local_notifications: ^18.0.1
  in_app_update: ^4.2.5
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation (Dine & Desk cream icon).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/appicon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cormorant
      fonts:
        # Registered once. The three previous entries all pointed at this
        # same physical file under different declared weights — Flutter
        # resolves any unregistered weight to the nearest registered one, so
        # a w500/w600 request already rendered this exact file; the extra
        # entries only tripled parse cost at startup for no visual change.
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 400
